name = "islamic-history"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# الموقع ملفات ثابتة من site/. الكود لا يعمل إلا على مسارات الملاحظات ولوحة الإدارة.
[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "islamic-history-feedback"
database_id = "02f72066-2cf9-48a4-88ea-19998a55007b"

# أسرار تُضبط من لوحة Cloudflare (Worker > Settings > Variables and Secrets، النوع Secret) ولا تُكتب هنا أبداً:
#   TURNSTILE_SECRET, IP_SALT
# إعدادات لوحة الإدارة (تُملأ بعد إعداد Cloudflare Access):
[vars]
ACCESS_TEAM = ""
ACCESS_AUD = ""
ADMIN_EMAILS = ""
