# نسخ احتياطي يومي مشفّر لقاعدة الملاحظات.
# يصدّر D1 إلى SQL، ويشفّره بمفتاح age العام (المفتاح الخاص لا يغادر جهاز المسؤول)،
# ثم يرفعه إلى حاوية R2 خاصة. البيانات التاريخية نفسها محفوظة بتاريخها الكامل في Git.
name: daily-backup
on:
  schedule: [{ cron: "30 2 * * *" }]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@3 d1 export islamic-history-feedback --remote --output=backup.sql
      - name: Encrypt
        run: |
          sudo apt-get install -y age
          age -r "${{ secrets.BACKUP_AGE_PUBLIC_KEY }}" -o "feedback-$(date -u +%F).sql.age" backup.sql
          shred -u backup.sql
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          f=$(ls feedback-*.sql.age)
          npx --yes wrangler@3 r2 object put "islamic-history-backups/$f" --file "$f" --remote
